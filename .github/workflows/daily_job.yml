name: Daily Engineer Radar Scraper

on:
  schedule:
    # 每天 UTC 時間 00:00 運行 (相當於北京/台北時間早上 8:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 允許你在網頁上手動點擊按鈕觸發

jobs:
  scrape_and_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # 必須賦予 token 權限，否則無法 push 數據庫更新
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Scraper Engine
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scraper.py

      - name: Commit and Push Database Updates
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add job_intel.db
          # 如果有變更才 commit，防止空報錯
          git diff --staged --quiet || git commit -m "🤖 Auto-update job_intel.db [$(date +'%Y-%m-%d')]"
          git push
